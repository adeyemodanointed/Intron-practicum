<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AfroXLMR with LoRA for five-domain text classification</title>
  <desc id="desc">Input text passes through tokenization, a frozen AfroXLMR encoder enhanced with trainable LoRA adapters, a new five-class classification head, and softmax probabilities.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 20px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .box-copy { font: 18px Arial, sans-serif; fill: #334155; }
      .small { font: 16px Arial, sans-serif; fill: #334155; }
      .white-title { font: 700 25px Arial, sans-serif; fill: #ffffff; }
      .white-copy { font: 18px Arial, sans-serif; fill: #e0f2fe; }
      .label { font: 700 16px Arial, sans-serif; fill: #ffffff; }
      .domain { font: 18px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text x="90" y="85" class="title">AfroXLMR + LoRA: Five-Domain Text Classifier</text>
  <text x="90" y="122" class="subtitle">The base language model is frozen; lightweight LoRA adapters and a new classification head are trained on our labelled data.</text>

  <rect x="90" y="270" width="235" height="205" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="207" y="325" text-anchor="middle" class="box-title">Input text</text>
  <text x="207" y="365" text-anchor="middle" class="box-copy">“Wakulima wanahitaji</text>
  <text x="207" y="390" text-anchor="middle" class="box-copy">mbegu bora…”</text>
  <text x="207" y="435" text-anchor="middle" class="small">Yoruba · Kinyarwanda</text>
  <text x="207" y="458" text-anchor="middle" class="small">Pidgin · Swahili</text>

  <line x1="326" y1="372" x2="405" y2="372" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="415" y="270" width="210" height="205" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="520" y="335" text-anchor="middle" class="box-title">Tokenizer</text>
  <text x="520" y="378" text-anchor="middle" class="box-copy">Text → tokens</text>
  <text x="520" y="408" text-anchor="middle" class="box-copy">with word context</text>

  <line x1="626" y1="372" x2="705" y2="372" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="715" y="205" width="365" height="340" rx="22" fill="#0f4c81"/>
  <text x="897" y="263" text-anchor="middle" class="white-title">AfroXLMR encoder</text>
  <text x="897" y="298" text-anchor="middle" class="white-copy">Multilingual contextual text representation</text>
  <rect x="755" y="337" width="285" height="65" rx="12" fill="#93c5fd"/>
  <text x="897" y="377" text-anchor="middle" class="box-title">Frozen base weights</text>
  <rect x="755" y="425" width="285" height="76" rx="12" fill="#fbbf24"/>
  <text x="897" y="457" text-anchor="middle" class="box-title">Trainable LoRA adapters</text>
  <text x="897" y="483" text-anchor="middle" class="small">inside attention layers</text>

  <line x1="1081" y1="372" x2="1160" y2="372" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1170" y="270" width="250" height="205" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1295" y="325" text-anchor="middle" class="box-title">Classification head</text>
  <text x="1295" y="365" text-anchor="middle" class="box-copy">New trainable layer</text>
  <text x="1295" y="398" text-anchor="middle" class="box-copy">produces 5 scores</text>
  <rect x="1212" y="425" width="166" height="29" rx="14" fill="#16a34a"/>
  <text x="1295" y="446" text-anchor="middle" class="label">TRAINABLE</text>

  <line x1="1421" y1="372" x2="1480" y2="372" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1490" y="208" width="75" height="330" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="1527" y="260" text-anchor="middle" class="box-title" transform="rotate(90 1527 260)">Softmax</text>
  <text x="1527" y="405" text-anchor="middle" class="small" transform="rotate(90 1527 405)">probabilities</text>

  <rect x="245" y="640" width="1110" height="145" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="285" y="688" class="box-title">Prediction</text>
  <rect x="505" y="661" width="152" height="76" rx="12" fill="#dbeafe"/>
  <text x="581" y="706" text-anchor="middle" class="domain">Agriculture</text>
  <rect x="675" y="661" width="125" height="76" rx="12" fill="#e2e8f0"/>
  <text x="737" y="706" text-anchor="middle" class="domain">Finance</text>
  <rect x="818" y="661" width="115" height="76" rx="12" fill="#e2e8f0"/>
  <text x="875" y="706" text-anchor="middle" class="domain">Health</text>
  <rect x="951" y="661" width="95" height="76" rx="12" fill="#e2e8f0"/>
  <text x="998" y="706" text-anchor="middle" class="domain">Law</text>
  <rect x="1064" y="661" width="250" height="76" rx="12" fill="#e2e8f0"/>
  <text x="1189" y="706" text-anchor="middle" class="domain">Telecommunications</text>
  <text x="581" y="767" text-anchor="middle" class="small">Highest probability = predicted domain</text>

  <rect x="92" y="826" width="238" height="34" rx="17" fill="#93c5fd"/>
  <text x="211" y="849" text-anchor="middle" class="small">Frozen AfroXLMR base</text>
  <rect x="350" y="826" width="237" height="34" rx="17" fill="#fbbf24"/>
  <text x="468" y="849" text-anchor="middle" class="small">Trainable LoRA adapters</text>
  <rect x="607" y="826" width="246" height="34" rx="17" fill="#16a34a"/>
  <text x="730" y="849" text-anchor="middle" class="label">Trainable classification head</text>
</svg>
