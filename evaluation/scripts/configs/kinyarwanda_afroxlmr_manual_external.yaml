# Scores the already trained AfroXLMR LoRA adapter on the untouched manual set.
# It must not be used to train, select checkpoints, or tune hyperparameters.
data_path: evaluation/evaluation_data/kinyarwanda/domain_evaluation.csv
base_model_path: ../PnC/models/afro-xlmr-base
adapter_path: modeling/domain_classification/kinyarwanda/outputs/afroxlmr_lora/best_adapter
output_dir: evaluation/results/kinyarwanda/afroxlmr_lora_manual_external

text_column: text
domain_column: domain
source_column: source
labels:
  - Agriculture
  - Finance
  - Health
  - Law
  - Telecommunications

max_length: 128
batch_size: 8
