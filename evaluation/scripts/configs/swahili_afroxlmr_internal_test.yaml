# One-time evaluation of the validation-selected AfroXLMR-LoRA model on the
# protected internal test split. No training or model selection occurs here.
data_path: data/splits/swahili/Data.csv.gz
base_model_path: ../PnC/models/afro-xlmr-base
adapter_path: modeling/domain_classification/swahili/outputs/afroxlmr_lora/best_adapter
output_dir: evaluation/results/swahili/afroxlmr_lora_internal_test

text_column: Text
domain_column: Domain
source_column: Source
split_column: Split (train/dev)
evaluation_split: test
evaluation_name: Internal test
result_prefix: internal_test

labels:
  - Agriculture
  - Finance
  - Health
  - Law
  - Telecommunications

max_length: 128
batch_size: 8
