# Initial AfroXLMR-LoRA baseline. Do not interpret its synthetic validation
# result as real-world Pidgin performance; use reviewed external data later.
model_name_or_path: ../PnC/models/afro-xlmr-base
data_path: data/splits/pidgin_synthetic/Data.csv.gz
output_dir: modeling/domain_classification/pidgin/outputs/afroxlmr_lora

text_column: Text
domain_column: Domain
split_column: Split
labels:
  - Agriculture
  - Finance
  - Health
  - Law
  - Telecommunications

max_length: 128
train_batch_size: 4
eval_batch_size: 8
gradient_accumulation_steps: 4
epochs: 12
learning_rate: 0.0002
weight_decay: 0.01
warmup_ratio: 0.1
early_stopping_patience: 3
random_seed: 13

lora_rank: 8
lora_alpha: 16
lora_dropout: 0.1
lora_target_modules: [query, value]
